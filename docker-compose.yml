services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/elephant
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./elephant:/app/elephant:ro
      - ./migrations:/app/migrations:ro
    ports:
      - "8085:8085"
    restart: unless-stopped

  db:
    image: timescale/timescaledb:2.31.0-pg18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elephant
      NO_TS_TUNE: "true"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db-init/002_drop_extra_timescaledb.sh:/docker-entrypoint-initdb.d/002_drop_extra_timescaledb.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d elephant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
